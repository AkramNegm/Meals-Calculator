<!DOCTYPE html>
<html lang="en">
<head>
    <title>Meals Calculator</title>
    <style>
        .container {
            width: 76%;
            margin: 0 auto;
            padding: 17px;
            background: darkblue;
            color: white; 
        }
        button {
            margin-top: 25px;
        }
    </style>
</head>
<body>

  <div class="container">
      <h1>My Meals</h1>
      
      <p>Food Name:</p>
      <input type="text" id="foodItem">
      
      <p>Protein (grams):</p>
      <input type="number" id="protVal">
      
      <p>Carbs (grams):</p>
      <input type="number" id="carbVal">
      
      <button id="addMealBtn">Add Meal</button>

      <p id="totalP">Total Protein: <b>0</b></p>
      <p id="totalC">Total Carbs: <b>0</b></p>

      <ul id="mealsList"></ul>
  </div>

</body>
</html>
